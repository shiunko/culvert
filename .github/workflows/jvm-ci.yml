name: JVM CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Eclipse Temurin 26.0.2+10
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26.0.2+10"

      - name: Verify exact Java runtime
        shell: bash
        run: |
          set -euo pipefail
          java_version="$(java -version 2>&1)"
          printf '%s\n' "$java_version"
          grep -Fq 'Temurin-26.0.2+10' <<<"$java_version" || {
            echo 'Expected Eclipse Temurin 26.0.2+10 exactly.' >&2
            exit 1
          }

      - name: Set up Clojure, Babashka, and clj-kondo
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.6.1673
          bb: 1.13.220
          clj-kondo: 2026.08.04

      # actions/setup-java 只识别 maven、gradle、sbt 三种依赖缓存管理器;
      # Clojure 不在其列,因此单独缓存 Clojure CLI 自身使用的目录。
      - name: Cache Clojure dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: cljdeps-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: cljdeps-${{ runner.os }}-

      - name: Install pinned cljfmt
        uses: jdx/mise-action@v4
        with:
          install: true

      - name: Format check
        run: bb fmt-check

      - name: Babashka tests
        run: bb test

      - name: JVM tests
        run: clojure -M:test

      - name: Namespace load check
        run: bb check

      - name: Static analysis
        run: clj-kondo --lint src test

      - name: Build uberjar
        run: clojure -T:build uber

      - name: Verify uberjar SHA-256
        shell: bash
        run: |
          set -euo pipefail
          checksum="$(find target -maxdepth 1 -type f -name '*-standalone.jar.sha256' -print -quit)"
          test -n "$checksum"
          (cd target && sha256sum --check "$(basename "$checksum")")

      - name: Build self-contained Linux application
        run: deploy/bin/build-jpackage

      - name: Upload JVM artifact
        uses: actions/upload-artifact@v6
        with:
          name: culvert-jvm-${{ github.sha }}
          path: |
            target/*-standalone.jar
            target/*-standalone.jar.sha256
            target/package/*.tar.gz
            target/package/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
